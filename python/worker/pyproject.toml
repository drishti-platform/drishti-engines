# The worker package of the python engine, pinned by hash like any other wheel in a locked environment. The engine JAR also carries it
# as resources and the pool manager puts it on the workers' path, so a pool on the site's interpreter needs no install.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti-engine-python-worker"
version = "1.0.0"
description = "The worker of the python engine: the Arrow codec, the engine contract, the worker loop, the sandbox, the items and pivot-function runtimes"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["engine_python*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
