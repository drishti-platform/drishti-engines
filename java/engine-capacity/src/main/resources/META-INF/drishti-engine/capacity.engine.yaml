# Generated by tools/capacity_descriptor.py from capacity/planner.yaml: edit the planner or the script, not this file.
engine: 1
id: capacity
version: 0.1.0
title: Capacity planner
about: >-
  Sizes one Drishti server from the counts an administrator types: heap, memory, disk, CPU, the settings and JVM arguments to use and the
  warnings to read. It has no inputs: one evaluator runs the expressions of capacity/planner.yaml over the request's parameters, and the
  explanation and the workbook are generated from the same steps.
publisher: { id: com.ash.engines, name: Drishti Engines }
product: drishti-platform
api: "0.1"
platform: { tools: "1.1" }
inputs: {}
options:
  exact-path: { type: bool, default: false, forces: exact-path, label: Exact path, help: This engine has one path (no grouped scans); the option changes nothing. }
params:
  positions: { type: int, default: 300000, min: 0, label: "Positions a business date", unit: "positions", help: "How many positions one business date holds. Default: the production shape, OTC trades, one trade a position, so positions = trades." }
  trades: { type: int, default: 300000, min: 0, label: "Trades a business date", unit: "trades", help: "How many trades those positions are made of. Default: production, about 300,000 trades." }
  trades-per-fungible: { type: number, default: 2, min: 0, label: "Trades per position, of positions that hold several", unit: "trades", help: "Only used when trades exceed positions: how many trades a shared (fungible) position holds on average." }
  portfolios: { type: int, default: 4500, min: 0, label: "Portfolios", unit: "portfolios", help: "Stored portfolios: baskets, rule portfolios, desk and book portfolios. Default: 300,000 ÷ 1,000,000 of the 1,000,000-position benchmark's 15,000 (desks and books grow with the positions: a desk holds 2,000 positions at both benchmark sizes, BENCHMARK.md 3)." }
  basket-members: { type: int, default: 600000, min: 0, label: "Basket members", unit: "members", help: "Positions named by all the baskets together. Default: 300,000 ÷ 1,000,000 of the 1,000,000-position benchmark's 2,000,000." }
  nodes: { type: int, default: 8107, min: 0, label: "Hierarchy nodes", unit: "nodes", help: "Nodes of every risk hierarchy (bank, legal entities, divisions, desks, limit letters...). Default: 300,000 ÷ 1,000,000 of the 1,000,000-position benchmark's 27,024." }
  books-cells: { type: int, default: 39000, min: 0, label: "Books and cells", unit: "books + cells", help: "Trading books plus the cells of column hierarchies. Default: 300,000 ÷ 1,000,000 of the 1,000,000-position benchmark's 130,000." }
  scenarios: { type: int, default: 509, min: 0, label: "Scenarios", unit: "scenarios", help: "Scenario days in a P&L vector (509: two years of history plus the base)." }
  trade-ccys-per-node: { type: number, default: 1, min: 0, label: "Trade currencies per node", unit: "currencies", help: "On average, how many trade currencies a node's trades are in." }
  lake-years: { type: number, default: 1, min: 0, label: "Years of business dates kept in the lake", unit: "years", help: "How much history the lake keeps (the bank's rule is often 7 years)." }
  hot-dates: { type: int, default: 10, min: 0, label: "Dates in memory (hot-dates)", unit: "dates", help: "Business dates kept open at once; the least recently used one leaves first." }
  pinned-mem: { type: int, default: 0, min: 0, label: "Pinned dates kept in memory", unit: "dates", help: "Dates that must always stay open (a month-end the desks compare with, an audit date)." }
  pinned-disk: { type: int, default: 0, min: 0, label: "Pinned dates kept on disk", unit: "dates", help: "Dates whose hot file is always kept on local disk, so they open in a second (month-ends, year-ends)." }
  ccys-ahead: { type: int, default: 0, min: 0, label: "Reporting currencies built ahead (besides USD)", unit: "currencies", help: "Each one is a whole extra book a date (the shipped setting builds 4: EUR, CAD, JPY, GBP)." }
  stress-on: { type: int, default: 0, allowed: [0, 1], min: 0, label: "Stress set on (1) or off (0)", unit: "0 or 1", help: "1 when stressed VaR is used: the stress set is a book of its own a date." }
  intraday-batches: { type: int, default: 10, min: 0, label: "Intraday batches a day", unit: "batches", help: "Intraday batches applied to today's date. Default 10 (hourly over the trading day): assumed, confirm the batch count." }
  updates-per-batch: { type: int, default: 11700, min: 0, label: "Updates per intraday batch", unit: "trades", help: "Trades amended, added or cancelled in one batch. Default: 39% of the 300,000 trades a day (117,000) over the 10 batches." }
  exposure-on: { type: int, default: 0, allowed: [0, 1], min: 0, label: "Exposure on (1) or off (0)", unit: "0 or 1", help: "1 when the counterparty exposure engine serves dates on this server." }
  netting-sets: { type: int, default: 10000, min: 0, label: "Netting sets", unit: "sets", help: "Netting sets a business date." }
  exp-trades: { type: int, default: 100000, min: 0, label: "Exposure trades", unit: "trades", help: "Trades with simulated paths a business date." }
  paths: { type: int, default: 200, min: 0, label: "Paths", unit: "paths", help: "Monte Carlo paths a trade." }
  time-steps: { type: int, default: 24, min: 0, label: "Time steps", unit: "grid dates", help: "Grid dates of a path." }
  exp-hot-dates: { type: int, default: 10, min: 0, label: "Exposure dates in memory", unit: "dates", help: "drishti.ccr.exposure.hot-dates: exposure dates kept open." }
  trade-rows-per-day: { type: int, default: 300000, min: 0, label: "Trade and BI rows a day", unit: "rows", help: "Trade rows loaded a business date, all trade systems together. Default: the same 300,000 production trades, served as trades too." }
  trade-days-kept: { type: int, default: 252, min: 0, label: "Days of trade rows kept", unit: "days", help: "Business days of trades kept in the lake (252 is a year)." }
  trade-connectors: { type: int, default: 3, min: 0, label: "Trade connectors", unit: "connectors", help: "Trade systems read through their own connector (for example ENDUR, CALYPSO, MUREX)." }
  users: { type: int, default: 50, min: 0, label: "Concurrent users", unit: "users", help: "People (or programs) asking questions at the same moment at the busiest time." }
  peak-rps: { type: number, default: 100, min: 0, label: "Peak requests a second wanted", unit: "requests/s", help: "Requests a second the server must answer at the peak." }
  var-share: { type: number, default: 0.5, min: 0, label: "Share of VaR questions", unit: "share", help: "Of those requests, the share that are VaR questions (the rest are trades, searches, pages)." }
  java-version: { type: int, default: 21, allowed: [21, 25], min: 0, label: "Java version (21 or 25)", unit: "21 or 25", help: "The Java the server runs on; 25 adds compact object headers." }
  load-threads: { type: int, default: 2, min: 0, label: "Load threads (drishti.var.load-threads)", unit: "threads", help: "Dates that may load from the lake at the same time." }
  collector: { type: text, default: "auto", allowed: ["auto", "G1", "ZGC"], label: "Garbage collector: auto, G1 or ZGC", unit: "text", help: "auto follows the documented rule: generational ZGC from 16 GB of heap, G1 below." }
  data-folder: { type: text, default: "/opt/drishti/data", label: "Data folder", unit: "path", help: "Where Drishti keeps everything it writes (dumps, logs and temporary files go under it)." }
  server-jar: { type: text, default: "drishti-server-{VERSION}-exec.jar", label: "Server jar", unit: "file", help: "The server's jar, as the command line starts it." }
